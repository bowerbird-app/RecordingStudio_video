# Test-only host override fixture. Loaded via I18n.backend.load_translations
# onto a fresh I18n::Backend::Simple inside one integration test — never
# appended to I18n.load_path and never placed under config/locales.
en:
  recording_studio:
    video:
      fields:
        title:
          label: "HOST Title"
        url:
          label: "HOST Video URL"
          hint: "HOST Paste a link to a supported video, such as YouTube."
        description:
          label: "HOST Description"
      errors:
        url:
          enter_supported: &host_enter_supported "HOST must be a supported video URL"
  activerecord:
    errors:
      models:
        recording_studio_video/video:
          attributes:
            url:
              enter_supported: *host_enter_supported
