# Host nested override for a rarely shown packaged key (boot-order guard).
# Loaded by Rails from config/locales — do not append this path in tests.
# enter_supported only appears after an invalid submit; /videos/new GET stays
# gem English for field labels and the URL hint.
en:
  recording_studio:
    video:
      errors:
        url:
          enter_supported: "HOST Enter a supported video URL."
